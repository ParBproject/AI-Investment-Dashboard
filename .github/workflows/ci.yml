name: Code quality and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff

      - name: Check syntax and critical errors
        run: ruff check app.py src tests --select E9,F63,F7,F82

      - name: Compile Python sources
        run: python -m compileall -q app.py src tests

      - name: Test short-frontier reproducibility
        run: pytest -q tests/test_optimizer.py::test_short_frontier_is_reproducible

      - name: Test short-frontier net exposure
        run: pytest -q tests/test_optimizer.py::test_short_frontier_weights_sum_to_one

      - name: Test short-frontier asset bounds
        run: pytest -q tests/test_optimizer.py::test_short_frontier_respects_asset_bounds

      - name: Test short-frontier finite metrics
        run: pytest -q tests/test_optimizer.py::test_short_frontier_metrics_are_finite

      - name: Test long-only reproducibility
        run: pytest -q tests/test_optimizer.py::test_long_only_frontier_is_reproducible

      - name: Test optimizer allocations
        run: pytest -q tests/test_optimizer.py::test_optimizers_return_valid_allocations

      - name: Test frontier size validation
        run: pytest -q tests/test_optimizer.py::test_invalid_frontier_size_is_rejected

      - name: Test non-finite input validation
        run: pytest -q tests/test_optimizer.py::test_non_finite_returns_are_rejected
