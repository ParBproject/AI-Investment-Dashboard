name: Quant research quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff

      - name: Lint critical errors
        run: ruff check app.py src tests --select E4,E7,E9,F

      - name: Compile Python sources
        run: python -m compileall -q app.py src tests

      - name: Run regression suite
        run: python -m pytest -q

      - name: Verify quantitative modules
        run: python -c "import src.derivatives, src.models, src.optimizer, src.utils"
