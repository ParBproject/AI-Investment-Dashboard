name: Code quality and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff

      - name: Check syntax and critical errors
        run: ruff check app.py src tests --select E9,F63,F7,F82

      - name: Compile Python sources
        run: python -m compileall -q app.py src tests

      - name: Test risk parity allocation
        run: pytest -q tests/test_optimizer.py::test_risk_parity_equalizes_risk_contributions

      - name: Test risk contribution reconciliation
        run: pytest -q tests/test_optimizer.py::test_risk_contributions_sum_to_portfolio_volatility

      - name: Test bounded short frontier
        run: pytest -q tests/test_optimizer.py::test_short_frontier_respects_bounds_and_is_reproducible

      - name: Test optimizer allocations
        run: pytest -q tests/test_optimizer.py::test_optimizers_return_valid_allocations

      - name: Test input validation
        run: pytest -q tests/test_optimizer.py::test_invalid_frontier_size_is_rejected
